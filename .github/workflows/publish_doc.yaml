name: Publish documentation

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "3.11"

      - name: Cache uv
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-doc-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Sync documentation dependencies
        run: uv sync --group doc

      - name: Generate CLI help files
        run: |
          uv run dcm2bids -h > docs_helper/help.txt
          uv run dcm2bids_helper -h > docs_helper/helper.txt
          uv run dcm2bids_scaffold -h > docs_helper/help_scaffold.txt
          echo "export VERSION=$(uv run dcm2bids -v | awk '/dcm2bids/ {print $3}')" > docs_helper/version.txt

      - name: Set git credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Build API reference
        run: uv run pdocs as_markdown -o docs/ dcm2bids --overwrite

      - name: Deploy release docs (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          uv run mike deploy -p "${{ github.ref_name }}"

      - name: Deploy release + latest (GitHub release event)
        if: github.event_name == 'release'
        run: |
          uv run mike deploy -p "${{ github.ref_name }}" latest -u

      - name: Deploy dev docs
        if: github.ref == 'refs/heads/dev'
        run: |
          uv run mike delete dev || true
          uv run mike deploy -p dev