name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Tests (${{ matrix.platform }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies (test group)
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest